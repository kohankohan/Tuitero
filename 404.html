<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Tuitero</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #16181c;
      --border: #2f3336;
      --blue: #1d9bf0;
      --text: #e7e9ea;
      --text-dim: #71767b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .error-container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }
    .error-badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .error-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    p {
      font-size: 1rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--blue);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
      padding: 12px 30px;
      border-radius: 9999px;
      transition: background 0.2s ease, transform 0.1s ease;
      cursor: pointer;
    }
    .btn-home:hover {
      background: #1a8cd8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="error-container">
    <div class="error-badge">ERROR 404 // URL INVÁLIDA</div>
    <div class="error-icon">📭</div>
    <h1>ESTE POSTEO NO EXISTE</h1>
    <p>La publicación o página que estás buscando fue eliminada por su autor, suspendida por moderación o nunca existió en el timeline.</p>
    <a href="/" class="btn-home">⬅ VOLVER AL TIMELINE</a>
  </main>
</body>
</html>
